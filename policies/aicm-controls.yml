# Cloud Custodian policies: one policy per testable sub-check of the 7 selected AICM controls.
# Every policy lists NON-COMPLIANT resources only (the filters describe the violation).
# controls.json maps policies to controls and stores the expected result of the seeded test.
#
# Project parameters (NOT part of the AICM text; change them to your own policy):
#   model integrity re-verification max age ..... 365 days  (AICM MDS-08 says "at least annually")
#   guardrail review max age .................... 180 days  (AICM TVM-11 gives no number)
policies:

  # ======================= MDS-08 Model Integrity Checks =======================
  - name: mds-08-baseline-checksum-format
    resource: s3
    filters:
      - type: value
        key: Name
        op: regex
        value: "^gemma-model"
      - not:
        - type: value
          key: "tag:model-sha256"
          op: regex
          value: "^[0-9a-f]{64}$"
  # The checkpoint itself is re-hashed by checker.py (builtin check "checkpoint-rehash").

  - name: mds-08-verification-recency
    resource: s3
    filters:
      - type: value
        key: Name
        op: regex
        value: "^gemma-model"
      - or:
        - type: value
          key: "tag:integrity-verified-at"
          value: absent
        - type: value
          key: "tag:integrity-verified-at"
          value_type: age
          op: gt
          value: 365

  # ======================= DSP-21 Data Poisoning Prevention & Detection =======================
  - name: dsp-21-public-access-block
    resource: s3
    filters:
      - type: value
        key: Name
        op: regex
        value: "^gemma-data"
      - or:
        - type: check-public-block
          BlockPublicAcls: false
        - type: check-public-block
          IgnorePublicAcls: false
        - type: check-public-block
          BlockPublicPolicy: false
        - type: check-public-block
          RestrictPublicBuckets: false

  - name: dsp-21-public-acl
    resource: s3
    filters:
      - type: value
        key: Name
        op: regex
        value: "^gemma-data"
      - type: global-grants

  - name: dsp-21-access-logging
    resource: s3
    filters:
      - type: value
        key: Name
        op: regex
        value: "^gemma-data"
      - type: value
        key: Logging
        value: empty
  # The dataset content is verified against manifest.json by checker.py (builtin "dataset-manifest").

  # ======================= TVM-11 Guardrails =======================
  - name: tvm-11-guardrail-declared
    resource: ec2
    filters:
      - type: value
        key: "tag:Name"
        op: glob
        value: "gemma-inference-*"
      - type: value
        key: State.Name
        op: in
        value: [pending, running, stopped]
      - type: value
        key: "tag:guardrail-id"
        value: absent
  # That the referenced guardrail really exists is checked by checker.py (builtin "guardrail-exists").

  - name: tvm-11-guardrail-review
    resource: ec2
    filters:
      - type: value
        key: "tag:Name"
        op: glob
        value: "gemma-inference-*"
      - type: value
        key: State.Name
        op: in
        value: [pending, running, stopped]
      - type: value
        key: "tag:guardrail-id"
        value: present
      - or:
        - type: value
          key: "tag:guardrail-reviewed-at"
          value: absent
        - type: value
          key: "tag:guardrail-reviewed-at"
          value_type: age
          op: gt
          value: 180

  # ======================= AIS-11 Agents Security Boundaries =======================
  - name: ais-11-inference-port-open
    resource: security-group
    filters:
      - type: value
        key: GroupName
        op: regex
        value: "^gemma-inference"
      - or:
        - type: ingress
          Ports: [11434]
          Cidr:
            value: "0.0.0.0/0"
        - type: ingress
          Ports: [11434]
          CidrV6:
            value: "::/0"

  - name: ais-11-vpc-flow-logs
    resource: vpc
    filters:
      - type: value
        key: "tag:Name"
        op: glob
        value: "gemma-vpc*"
      - type: flow-logs
        enabled: false

  # ======================= AIS-13 AI Sandboxing =======================
  - name: ais-13-imdsv2
    resource: ec2
    filters:
      - type: value
        key: "tag:Name"
        op: glob
        value: "gemma-inference-*"
      - type: value
        key: State.Name
        op: in
        value: [pending, running, stopped]
      - type: value
        key: MetadataOptions.HttpTokens
        op: ne
        value: required

  - name: ais-13-imds-hop-limit
    resource: ec2
    filters:
      - type: value
        key: "tag:Name"
        op: glob
        value: "gemma-inference-*"
      - type: value
        key: State.Name
        op: in
        value: [pending, running, stopped]
      - type: value
        key: MetadataOptions.HttpPutResponseHopLimit
        value_type: integer
        op: gt
        value: 1

  - name: ais-13-no-public-ip
    resource: ec2
    filters:
      - type: value
        key: "tag:Name"
        op: glob
        value: "gemma-inference-*"
      - type: value
        key: State.Name
        op: in
        value: [pending, running, stopped]
      - type: value
        key: PublicIpAddress
        value: present

  - name: ais-13-egress-restricted
    resource: ec2
    filters:
      - type: value
        key: "tag:Name"
        op: glob
        value: "gemma-inference-*"
      - type: value
        key: State.Name
        op: in
        value: [pending, running, stopped]
      - or:
        - type: security-group
          key: "IpPermissionsEgress[].IpRanges[].CidrIp"
          op: contains
          value: "0.0.0.0/0"
        - type: security-group
          key: "IpPermissionsEgress[].Ipv6Ranges[].CidrIpv6"
          op: contains
          value: "::/0"

  # ======================= LOG-15 Output Monitoring =======================
  - name: log-15-monitoring-destination
    resource: log-group
    filters:
      - type: value
        key: logGroupName
        op: regex
        value: "^/gemma/inference"
      - not:
        - type: subscription-filter
  # The log CONTENT (output + metadata fields) is verified by checker.py (builtin "output-event-fields").

  # ======================= IAM-19 Agent Access Restriction =======================
  # No Custodian policy: wildcard actions / wildcard resources in attached and inline policies are
  # analysed by checker.py (builtins "wildcard-action" and "wildcard-resource").
